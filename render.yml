services:
  - type: web
    name: production-langgraph-api
    runtim: python
    region: oregon
    plan: free
    buildCommand: pip install uv && uv sync --frozon --no-dev
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: RATE_LIMIT
        value: "20/minute"
      - key: CACHE_TTL_SECONDS
        value: "300"
      - key: MAX_RETRIES
        value: "3"
      - key: PRIMARY_MODEL
        value: "deepseek-chat"
      - key: FALLBACK_MODEL
        value: "deepseek-chat"
      - key: LANGSMITH_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: "https://api.deepseek.api"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_PROJECT
        value: "test"
    healthCheckPath: /health
    autoDeploy: true

      
